[common]
# Server address and port / 服务端地址与端口
server_addr = 127.0.0.1
server_port = 3017

# Authentication token (must match server) / 认证密码（需与服务端保持一致）
token = 12345678

# Local mixed proxy (SOCKS5 + HTTP/HTTPS); leave local_port empty or 0 to disable when redir is enabled
# 本地混合代理（SOCKS5 + HTTP/HTTPS）；启用透明代理时可将 local_port 留空或设为 0 以关闭
local_addr = 127.0.0.1
local_port = 1080

# Linux transparent proxy (iptables/nftables REDIRECT, Linux only) / Linux 透明代理（仅 Linux 有效）
# redir_addr = 0.0.0.0
# redir_port = 1081
