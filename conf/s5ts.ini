[common]
# Server bind address and port / 服务端监听地址与端口
bind_addr = 0.0.0.0
bind_port = 3017

# Authentication token (leave empty to disable) / 接入认证密码（留空表示不启用密码校验）
token = 12345678

# Custom TLS certificate and key (auto-generates in-memory self-signed cert if omitted)
# 自定义 TLS 证书路径（未配置时在内存中自动生成自签名证书）
# tls_cert_file = ./server.crt
# tls_key_file = ./server.key
