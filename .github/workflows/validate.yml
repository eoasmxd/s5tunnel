name: Validate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Verify Code Formatting & Vet
        run: |
          go vet ./...

      - name: Validate Linux Build
        run: |
          go build -v -o /dev/null ./cmd/s5tc
          go build -v -o /dev/null ./cmd/s5ts

      - name: Validate Windows Build
        run: |
          env GOOS=windows go build -v -o /dev/null ./cmd/s5tc
          env GOOS=windows go build -ldflags "-H=windowsgui" -v -o /dev/null ./cmd/s5tc-gui
          env GOOS=windows go build -v -o /dev/null ./cmd/s5ts
